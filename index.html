<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Registro de Flotilla</title>
  <style>
    :root {
      --bg: #f5f4f0;
      --surface: #ffffff;
      --border: rgba(0,0,0,0.1);
      --text: #1a1a1a;
      --muted: #6b6b6b;
      --blue-bg: #E6F1FB;
      --blue-text: #0C447C;
      --blue-btn: #185FA5;
      --green-bg: #EAF3DE;
      --green-text: #27500A;
      --green-btn: #3B6D11;
      --red-bg: #FCEBEB;
      --red-text: #791F1F;
      --radius: 12px;
      --radius-sm: 8px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 24px 16px 48px;
    }
    .logo {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: .08em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 20px;
      margin-top: 4px;
    }
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      border: 0.5px solid var(--border);
      padding: 20px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    .car-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 10px;
    }
    .badge-salida { background: var(--blue-bg); color: var(--blue-text); }
    .badge-regreso { background: var(--green-bg); color: var(--green-text); }
    .card-title { font-size: 18px; font-weight: 600; color: var(--text); }
    .card-sub { font-size: 13px; color: var(--muted); margin-top: 2px; margin-bottom: 16px; }
    .divider { border: none; border-top: 0.5px solid var(--border); margin: 14px 0; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 12px; font-weight: 500; color: var(--muted); margin-bottom: 5px; }
    .field select, .field input {
      width: 100%;
      padding: 10px 12px;
      font-size: 15px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: #fafaf9;
      color: var(--text);
      -webkit-appearance: none;
      appearance: none;
    }
    .field select:focus, .field input:focus {
      outline: 2px solid var(--blue-btn);
      outline-offset: 1px;
    }
    .info-banner {
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      margin-bottom: 14px;
      font-size: 13px;
    }
    .info-banner .ib-title { font-weight: 600; margin-bottom: 2px; }
    .info-banner.blue { background: var(--blue-bg); color: var(--blue-text); }
    .info-banner.green { background: var(--green-bg); color: var(--green-text); }
    .km-preview {
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px;
    }
    .btn {
      width: 100%;
      padding: 13px;
      border-radius: var(--radius-sm);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      margin-top: 6px;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: opacity .15s, transform .1s;
    }
    .btn:active { transform: scale(.98); opacity: .9; }
    .btn-salida { background: var(--blue-btn); }
    .btn-regreso { background: var(--green-btn); }
    .time-hint {
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      margin-top: 10px;
    }
    /* Loading / Success states */
    .state { display: none; }
    .state.active { display: block; }
    #state-loading {
      text-align: center;
      padding: 40px 0;
    }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--blue-btn);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #state-success {
      text-align: center;
      padding: 20px 0;
    }
    .check-circle {
      width: 56px; height: 56px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 14px;
      font-size: 26px;
    }
    .check-circle.salida { background: var(--blue-bg); color: var(--blue-btn); }
    .check-circle.regreso { background: var(--green-bg); color: var(--green-btn); }
    #state-success h2 { font-size: 18px; font-weight: 600; margin-bottom: 6px; }
    #state-success p { font-size: 14px; color: var(--muted); }
    .summary-box {
      background: #fafaf9;
      border: 0.5px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      margin-top: 14px;
      text-align: left;
      font-size: 13px;
    }
    .summary-box .row { display: flex; justify-content: space-between; padding: 3px 0; }
    .summary-box .row .lbl { color: var(--muted); }
    .summary-box .row .val { font-weight: 500; color: var(--text); }
    #state-error {
      text-align: center;
      padding: 20px 0;
    }
    .x-circle {
      width: 56px; height: 56px;
      border-radius: 50%;
      background: var(--red-bg);
      color: var(--red-text);
      display: flex; align-items: center; justify-content: center;
      font-size: 26px;
      margin: 0 auto 14px;
    }
    #state-error h2 { font-size: 17px; font-weight: 600; color: var(--red-text); margin-bottom: 6px; }
    #state-error p { font-size: 13px; color: var(--muted); margin-bottom: 14px; }
    .btn-retry { background: #333; width: auto; padding: 10px 24px; border-radius: 20px; font-size: 14px; margin: 0 auto; }
    footer {
      margin-top: 28px;
      font-size: 12px;
      color: #aaa;
      text-align: center;
    }
  </style>
</head>
<body>

<div class="logo">🚗 Control de Flotilla</div>

<div class="card">

  <!-- STATE: FORM -->
  <div id="state-form" class="state active">
    <div id="badge-container"></div>
    <div class="card-title" id="form-title">Cargando...</div>
    <div class="card-sub" id="form-sub"></div>

    <div id="active-trip-banner" style="display:none"></div>
    <hr class="divider" />

    <div id="form-fields"></div>

    <button class="btn" id="btn-submit" onclick="submitForm()">
      <span id="btn-icon"></span>
      <span id="btn-text">Registrar</span>
    </button>
    <p class="time-hint" id="time-hint"></p>
  </div>

  <!-- STATE: LOADING -->
  <div id="state-loading" class="state">
    <div class="spinner"></div>
    <p style="color:var(--muted); font-size:14px;">Guardando registro...</p>
  </div>

  <!-- STATE: SUCCESS -->
  <div id="state-success" class="state">
    <div class="check-circle" id="success-icon">✓</div>
    <h2 id="success-title"></h2>
    <p id="success-msg"></p>
    <div class="summary-box" id="success-summary"></div>
  </div>

  <!-- STATE: ERROR -->
  <div id="state-error" class="state">
    <div class="x-circle">✕</div>
    <h2>Error al guardar</h2>
    <p id="error-msg">No se pudo conectar con el servidor. Verifica tu conexión e intenta de nuevo.</p>
    <button class="btn btn-salida btn-retry" onclick="goBack()">Reintentar</button>
  </div>

</div>

<footer>Registro automático via NFC · Hora del servidor</footer>

<script>
  // ─── CONFIGURACIÓN ───────────────────────────────────────────────
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyEImcssq3Smjm7wd5W0kiqXcZQSYkJXj9KBVV5bE3IieX9c8ZZynKUG3kWTAv_NvfUFw/exec";

  // Lista de choferes: [id, nombre]
  const CHOFERES = [
    ["PG-01", "Pablo Gonzalez"],
    ["SA-02", "Sergio Aguilera"],
    ["DM-03", "Domingo Luna"],
    ["JV-04", "Juan Vargas"],
    ["GM-05", "Geovanny Mendoza"],
    ["GR-06", "Gilberto Rodriguez"],
    ["EE-07", "Eduardo Espinoza"],
  ];
  // ─────────────────────────────────────────────────────────────────

  const params = new URLSearchParams(window.location.search);
const AUTO = params.get("auto") || "UNIDAD-??";
if (!params.get("t")) {
  window.location.replace(window.location.href + "&t=" + Date.now());
}

  let tipoRegistro = "salida";   // se determina según si hay viaje activo
  let viajeActivo = null;        // datos del viaje activo si existe
  let now = new Date();

  function formatTime(d) {
    return d.toLocaleTimeString("es-MX", { hour: "2-digit", minute: "2-digit", hour12: false });
  }
  function formatDate(d) {
    return d.toLocaleDateString("es-MX", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  }

  function jsonp(url) {
    return new Promise((resolve) => {
      const cbName = "cb_" + Math.random().toString(36).slice(2);
      const timeout = setTimeout(() => {
        delete window[cbName];
        if (script.parentNode) script.parentNode.removeChild(script);
        resolve(null);
      }, 6000);
      window[cbName] = function(data) {
        clearTimeout(timeout);
        delete window[cbName];
        if (script.parentNode) script.parentNode.removeChild(script);
        resolve(data);
      };
      const script = document.createElement("script");
      script.src = url + "&callback=" + cbName;
      document.head.appendChild(script);
    });
  }

  async function init() {
    const scriptConfigurado = true;

    if (scriptConfigurado) {
      const data = await jsonp(`${APPS_SCRIPT_URL}?action=checkActive&auto=${encodeURIComponent(AUTO)}`);
      viajeActivo = (data && data.activo) ? data : null;
    } else {
      viajeActivo = null;
    }

    tipoRegistro = viajeActivo ? "regreso" : "salida";
    renderForm();
  }

  function renderForm() {
    const badge = document.getElementById("badge-container");
    const title = document.getElementById("form-title");
    const sub = document.getElementById("form-sub");
    const banner = document.getElementById("active-trip-banner");
    const fields = document.getElementById("form-fields");
    const btnSubmit = document.getElementById("btn-submit");
    const btnIcon = document.getElementById("btn-icon");
    const btnText = document.getElementById("btn-text");
    const hint = document.getElementById("time-hint");

    now = new Date();

    const scriptSinConfigurar = false;

    if (tipoRegistro === "salida") {
      badge.innerHTML = `<div class="car-badge badge-salida">🚗 ${AUTO}</div>`;
      title.textContent = "Registro de salida";
      sub.textContent = formatDate(now);

      if (scriptSinConfigurar) {
        banner.style.display = "block";
        banner.innerHTML = `<div style="background:#FAEEDA;border-radius:8px;padding:10px 12px;font-size:13px;color:#633806;margin-bottom:10px;">
          ⚠ <strong>Falta configurar:</strong> Abre index.html y reemplaza <code style="background:rgba(0,0,0,.1);padding:1px 5px;border-radius:4px">PEGA_AQUI_TU_URL_DE_APPS_SCRIPT</code> con la URL de tu Apps Script.
        </div>`;
      } else {
        banner.style.display = "none";
      }

      btnSubmit.className = "btn btn-salida";
      btnIcon.textContent = "↗";
      btnText.textContent = "Registrar salida";
      hint.textContent = `Hora de salida: ${formatTime(now)} hrs (se registra automáticamente)`;

      fields.innerHTML = `
        <div class="field">
          <label>Chofer</label>
          <select id="chofer-select">
            <option value="">— Selecciona tu ID —</option>
            ${CHOFERES.map(c => `<option value="${c[0]}">${c[1]} (${c[0]})</option>`).join("")}
          </select>
        </div>
        <div class="field">
          <label>Kilometraje al salir</label>
          <input type="number" id="km-salida" placeholder="Ej: 45230" min="0" inputmode="numeric" />
          <div class="km-preview" id="km-preview"></div>
        </div>
      `;

      document.getElementById("km-salida").addEventListener("input", function() {
        const v = parseInt(this.value);
        document.getElementById("km-preview").textContent = v ? `${v.toLocaleString("es-MX")} km` : "";
      });

    } else {
      // REGRESO
      badge.innerHTML = `<div class="car-badge badge-regreso">🚗 ${AUTO}</div>`;
      title.textContent = "Registro de regreso";
      sub.textContent = "Este vehículo tiene una salida activa";

      banner.style.display = "block";
      banner.innerHTML = `
        <div class="info-banner blue">
          <div class="ib-title">Salida registrada</div>
          <div>${viajeActivo.choferNombre} · ${viajeActivo.horaSalida} hrs · Km salida: ${parseInt(viajeActivo.kmSalida).toLocaleString("es-MX")}</div>
        </div>
      `;

      btnSubmit.className = "btn btn-regreso";
      btnIcon.textContent = "↙";
      btnText.textContent = "Registrar regreso";
      hint.textContent = `Hora de regreso: ${formatTime(now)} hrs (se registra automáticamente)`;

      fields.innerHTML = `
        <div class="field">
          <label>Chofer</label>
          <select id="chofer-select">
            ${CHOFERES.map(c =>
              `<option value="${c[0]}" ${c[0] === viajeActivo.choferId ? "selected" : ""}>${c[1]} (${c[0]})</option>`
            ).join("")}
          </select>
        </div>
        <div class="field">
          <label>Kilometraje al regresar</label>
          <input type="number" id="km-regreso" placeholder="Debe ser mayor a ${parseInt(viajeActivo.kmSalida).toLocaleString("es-MX")}" min="${parseInt(viajeActivo.kmSalida)+1}" inputmode="numeric" />
          <div class="km-preview" id="km-preview"></div>
        </div>
      `;

      document.getElementById("km-regreso").addEventListener("input", function() {
        const v = parseInt(this.value);
        const diff = v - parseInt(viajeActivo.kmSalida);
        document.getElementById("km-preview").textContent = v
          ? `${v.toLocaleString("es-MX")} km${diff > 0 ? ` · Recorrido: ${diff.toLocaleString("es-MX")} km` : ""}`
          : "";
      });
    }
  }

  async function submitForm() {
    const choferEl = document.getElementById("chofer-select");
    const choferId = choferEl ? choferEl.value : "";
    const choferNombre = choferEl ? choferEl.options[choferEl.selectedIndex].text : "";

    if (!choferId) { alert("Por favor selecciona tu nombre."); return; }

    now = new Date();

    if (tipoRegistro === "salida") {
      const kmSalidaEl = document.getElementById("km-salida");
      const kmSalida = kmSalidaEl ? kmSalidaEl.value.trim() : "";
      if (!kmSalida || isNaN(kmSalida) || parseInt(kmSalida) < 0) {
        alert("Por favor ingresa el kilometraje actual del vehículo."); return;
      }

      showState("loading");

      const payload = {
        action: "salida",
        auto: AUTO,
        choferId,
        choferNombre: choferNombre.replace(/ \(.*\)$/, ""),
        kmSalida: parseInt(kmSalida),
        horaSalida: formatTime(now),
        fechaSalida: now.toISOString(),
      };

      const ok = await sendData(payload);
      if (ok) {
        showSuccess("salida", payload);
      } else {
        showState("error");
      }

    } else {
      const kmRegresoEl = document.getElementById("km-regreso");
      const kmRegreso = kmRegresoEl ? kmRegresoEl.value.trim() : "";
      const kmMin = parseInt(viajeActivo.kmSalida) + 1;
      if (!kmRegreso || isNaN(kmRegreso) || parseInt(kmRegreso) < kmMin) {
        alert(`El kilometraje debe ser mayor a ${kmMin.toLocaleString("es-MX")}.`); return;
      }

      showState("loading");

      const payload = {
        action: "regreso",
        auto: AUTO,
        choferId,
        choferNombre: choferNombre.replace(/ \(.*\)$/, ""),
        kmRegreso: parseInt(kmRegreso),
        horaRegreso: formatTime(now),
        fechaRegreso: now.toISOString(),
        rowId: viajeActivo.rowId,
        kmSalida: parseInt(viajeActivo.kmSalida),
      };

      const ok = await sendData(payload);
      if (ok) {
        showSuccess("regreso", payload);
      } else {
        showState("error");
      }
    }
  }

  async function sendData(payload) {
    try {
      await fetch(APPS_SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify(payload),
      });
      return true;
    } catch(e) {
      return false;
    }
  }

  function showState(name) {
    ["form","loading","success","error"].forEach(s => {
      document.getElementById("state-" + s).classList.remove("active");
    });
    document.getElementById("state-" + name).classList.add("active");
  }

  function showSuccess(tipo, data) {
    showState("success");
    const icon = document.getElementById("success-icon");
    const title = document.getElementById("success-title");
    const msg = document.getElementById("success-msg");
    const summary = document.getElementById("success-summary");

    if (tipo === "salida") {
      icon.className = "check-circle salida";
      title.textContent = "¡Salida registrada!";
      msg.textContent = "Datos guardados en Google Sheets";
      summary.innerHTML = `
        <div class="row"><span class="lbl">Vehículo</span><span class="val">${data.auto}</span></div>
        <div class="row"><span class="lbl">Chofer</span><span class="val">${data.choferNombre}</span></div>
        <div class="row"><span class="lbl">Hora salida</span><span class="val">${data.horaSalida} hrs</span></div>
        <div class="row"><span class="lbl">Km salida</span><span class="val">${data.kmSalida.toLocaleString("es-MX")} km</span></div>
      `;
    } else {
      const recorrido = data.kmRegreso - data.kmSalida;
      icon.className = "check-circle regreso";
      title.textContent = "¡Regreso registrado!";
      msg.textContent = "Viaje completado y guardado";
      summary.innerHTML = `
        <div class="row"><span class="lbl">Vehículo</span><span class="val">${data.auto}</span></div>
        <div class="row"><span class="lbl">Chofer</span><span class="val">${data.choferNombre}</span></div>
        <div class="row"><span class="lbl">Hora regreso</span><span class="val">${data.horaRegreso} hrs</span></div>
        <div class="row"><span class="lbl">Km recorridos</span><span class="val">${recorrido.toLocaleString("es-MX")} km</span></div>
      `;
    }
  }

  function goBack() {
    showState("form");
  }

  init();
</script>

</body>
</html>
